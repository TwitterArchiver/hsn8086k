  快速幂, 模 7.
  <br/>
  或者说, 把模数转换成二进制.
  <br/>
  10001101
  <br/>
  那答案就是1+5¹*5⁴*5⁸*5¹²⁸%7
  <br/>
  可以观察到
  <br/>
  5²=5¹*5¹
  <br/>
  5⁴=5²*5²
  <br/>
  所以
  <br/>
  5¹%7=5
  <br/>
  5²%7=5*5%7=4
  <br/>
  5⁴%7=4*4%7=2
  <br/>
  5⁸%7=4
  <br/>
  5¹⁶%7=2
  <br/>
  5³²%7=4
  <br/>
  5⁶⁴%7=2
  <br/>
  5¹²⁸%7=4
  <br/>
  (1+5¹*5⁴*5⁸*5¹²⁸)%7=(1+5*4*2*4)%7=0
  <br/>
  答案是: 周日
